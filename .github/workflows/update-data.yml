name: Update Blobigames Analytics

on:
  push:
    paths:
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  START_DATE: "2026-03-13"
  WORKER: "https://shortioapikey.help-blobigames.workers.dev"
  ARCHIVE_VERSION: "3"

jobs:
  archive-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current complete export
        run: |
          mkdir -p public
          curl -L --fail --retry 3 \
            --user-agent "BlobigamesAnalytics/3.0" \
            "$WORKER/data" \
            -o public/full-data.json

      - name: Build daily historical archive
        run: |
          mkdir -p public/data

          python3 <<'PY'
          import json
          import os
          import time
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          import subprocess

          START = date.fromisoformat(os.environ["START_DATE"])
          WORKER = os.environ["WORKER"]
          VERSION = os.environ["ARCHIVE_VERSION"]
          out_dir = Path("public/data")
          today = datetime.now(timezone.utc).date()

          def fetch_day(d):
              url = f"{WORKER}/day?{urlencode({'date': d.isoformat()})}"
              temp = Path("/tmp/day.json")

              last_error = None
              for attempt in range(4):
                  try:
                      result = subprocess.run(
                          [
                              "curl",
                              "-L",
                              "--fail",
                              "--silent",
                              "--show-error",
                              "--user-agent",
                              "BlobigamesAnalytics/3.0",
                              "--max-time",
                              "240",
                              url
                          ],
                          capture_output=True,
                          text=True
                      )

                      if result.returncode != 0:
                          raise RuntimeError(
                              f"curl exit {result.returncode}: {result.stderr.strip()}"
                          )

                      data = json.loads(result.stdout)

                      if not isinstance(data, dict) or "domains" not in data:
                          raise RuntimeError("Worker returned unexpected JSON")

                      data["archiveVersion"] = VERSION
                      return data

                  except Exception as exc:
                      last_error = exc
                      time.sleep(2 ** attempt)

              raise RuntimeError(
                  f"Daily request failed for {d}: {last_error}"
              )

          d = START

          while d <= today:
              output_file = out_dir / f"{d.isoformat()}.json"

              needs_refresh = True

              if output_file.exists():
                  try:
                      old = json.loads(
                          output_file.read_text(encoding="utf-8")
                      )
                      needs_refresh = (
                          str(old.get("archiveVersion")) != VERSION
                      )
                  except Exception:
                      needs_refresh = True

              if (
                  needs_refresh
                  or d == today
                  or d == today - timedelta(days=1)
              ):
                  print(f"Fetching {d}")

                  daily = fetch_day(d)

                  output_file.write_text(
                      json.dumps(
                          daily,
                          ensure_ascii=False,
                          indent=2
                      ),
                      encoding="utf-8"
                  )

                  time.sleep(0.35)

              d += timedelta(days=1)

          files = sorted(
              p.stem
              for p in out_dir.glob("????-??-??.json")
          )

          (out_dir / "index.json").write_text(
              json.dumps(
                  {
                      "archiveVersion": VERSION,
                      "startDate": files[0] if files else None,
                      "endDate": files[-1] if files else None,
                      "dates": files,
                      "generatedAt": datetime.now(
                          timezone.utc
                      ).isoformat().replace("+00:00", "Z")
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )
          PY

      - name: Build complete analytics index
        run: |
          python3 <<'PY'
          import json
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          data_dir = Path("public/data")

          months = defaultdict(lambda: {
              "clicks": 0,
              "humanClicks": 0,
              "domains": defaultdict(lambda: {
                  "clicks": 0,
                  "humanClicks": 0
              })
          })

          all_time = {
              "clicks": 0,
              "humanClicks": 0,
              "domains": defaultdict(lambda: {
                  "clicks": 0,
                  "humanClicks": 0
              })
          }

          links = {}

          for path in sorted(data_dir.glob("????-??-??.json")):
              daily = json.loads(
                  path.read_text(encoding="utf-8")
              )

              day = daily["date"]
              month = day[:7]

              for hostname, domain in daily.get("domains", {}).items():
                  stats = domain.get("statistics", {})
                  clicks = int(stats.get("clicks", 0) or 0)
                  human = int(stats.get("humanClicks", 0) or 0)

                  months[month]["clicks"] += clicks
                  months[month]["humanClicks"] += human
                  months[month]["domains"][hostname]["clicks"] += clicks
                  months[month]["domains"][hostname]["humanClicks"] += human

                  all_time["clicks"] += clicks
                  all_time["humanClicks"] += human
                  all_time["domains"][hostname]["clicks"] += clicks
                  all_time["domains"][hostname]["humanClicks"] += human

                  for item in domain.get("linkClicks", []):
                      key = f"{hostname}:{item.get('id') or item.get('path')}"

                      if key not in links:
                          links[key] = {
                              "domain": hostname,
                              "id": item.get("id"),
                              "path": item.get("path"),
                              "title": item.get("title"),
                              "originalURL": item.get("originalURL"),
                              "createdAt": item.get("createdAt"),
                              "daily": {}
                          }

                      links[key]["daily"][day] = int(
                          item.get("clicks", 0) or 0
                      )

          def normalise(obj):
              if isinstance(obj, defaultdict):
                  obj = dict(obj)
              if isinstance(obj, dict):
                  return {k: normalise(v) for k, v in obj.items()}
              return obj

          result = {
              "archiveVersion": "3",
              "generatedAt": datetime.now(
                  timezone.utc
              ).isoformat().replace("+00:00", "Z"),
              "timezone": "Europe/Zurich",
              "months": normalise(dict(months)),
              "allTime": normalise(all_time),
              "links": normalise(links)
          }

          Path("public/data/aggregates.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Generate readable HTML
        run: |
          python3 <<'PY'
          import json
          from html import escape
          from pathlib import Path

          data = json.loads(
              Path("public/full-data.json").read_text(
                  encoding="utf-8"
              )
          )

          pretty = json.dumps(
              data,
              indent=2,
              ensure_ascii=False
          )

          generated = escape(
              data.get("generatedAt", "Unknown")
          )

          html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Blobigames Analytics</title>
          </head>
          <body>
            <h1>Blobigames Short.io Analytics</h1>
            <p>Complete current dataset for both Blobigames domains.</p>
            <p>Generated: {generated}</p>
            <p><a href="full-data.json">Complete current JSON</a></p>
            <p><a href="data/index.json">Daily historical archive index</a></p>
            <p><a href="data/aggregates.json">Complete analytics index</a></p>
            <pre style="white-space:pre-wrap;word-break:break-word;font-family:monospace;font-size:13px;line-height:1.45">{escape(pretty)}</pre>
          </body>
          </html>'''

          Path("public/index.html").write_text(
              html,
              encoding="utf-8"
          )
          PY

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data public/full-data.json public/index.html

          git diff --cached --quiet || \
            git commit -m "Update complete analytics archive"

          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
