name: Update Blobigames Analytics

on:
  push:
    paths:
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  START_DATE: "2026-03-13"
  WORKER: "https://shortioapikey.help-blobigames.workers.dev"
  ARCHIVE_VERSION: "4"

jobs:
  archive-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current complete export
        run: |
          mkdir -p public
          curl -L --fail --retry 5 --retry-delay 2 \
            -A "BlobigamesAnalytics/4.0" \
            "$WORKER/data" \
            -o public/full-data.json

      - name: Rebuild daily historical archive from batched link-ID queries
        run: |
          mkdir -p public/data

          python3 <<'PY'
          import json
          import os
          import time
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          START = date.fromisoformat(os.environ["START_DATE"])
          WORKER = os.environ["WORKER"]
          VERSION = os.environ["ARCHIVE_VERSION"]
          OUT = Path("public/data")
          TODAY = datetime.now(timezone.utc).date()

          def get_json(url, attempts=8):
              last_error = None
              for attempt in range(attempts):
                  try:
                      req = Request(
                          url,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "BlobigamesAnalytics/4.0"
                          }
                      )
                      with urlopen(req, timeout=180) as response:
                          status = getattr(response, "status", 200)
                          if status != 200:
                              raise RuntimeError(f"HTTP {status}")
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as exc:
                      last_error = exc
                      if attempt < attempts - 1:
                          time.sleep(min(30, 2 ** attempt))
              raise RuntimeError(f"Request failed after {attempts} attempts: {last_error}")

          links_response = get_json(f"{WORKER}/links")
          domains = links_response.get("domains", {})

          if not domains:
              raise RuntimeError("Worker returned no domains from /links")

          domain_info = {}
          for hostname, links in domains.items():
              if not isinstance(links, list):
                  continue
              ids = []
              metadata = {}
              for link in links:
                  if not isinstance(link, dict):
                      continue
                  link_id = link.get("idString") or link.get("id")
                  if not link_id:
                      continue
                  ids.append(link_id)
                  metadata[link_id] = {
                      "id": link_id,
                      "path": link.get("path"),
                      "displayPath": link.get("displayPath"),
                      "title": link.get("title"),
                      "originalURL": link.get("originalURL"),
                      "createdAt": link.get("createdAt")
                  }
              domain_info[hostname] = {
                  "ids": ids,
                  "metadata": metadata
              }

          def query_domain_day(hostname, ids, day):
              if not ids:
                  return {}

              params = urlencode({
                  "domain": hostname,
                  "ids": ",".join(ids),
                  "startDate": day.isoformat(),
                  "endDate": day.isoformat()
              })

              data = get_json(f"{WORKER}/link-clicks?{params}")
              raw = data.get("clicks", {})

              if not isinstance(raw, dict):
                  raise RuntimeError(
                      f"Unexpected link-click response for {hostname} on {day}"
                  )

              return raw

          def as_clicks(value):
              if isinstance(value, bool):
                  return None
              if isinstance(value, int):
                  return value if value >= 0 else None
              if isinstance(value, float):
                  return int(value) if value >= 0 else None
              if isinstance(value, str):
                  try:
                      number = int(float(value))
                      return number if number >= 0 else None
                  except ValueError:
                      return None
              if isinstance(value, dict):
                  if "clicks" in value:
                      return as_clicks(value["clicks"])
              return None

          d = START
          while d <= TODAY:
              output_file = OUT / f"{d.isoformat()}.json"
              refresh = True

              if output_file.exists():
                  try:
                      old = json.loads(output_file.read_text(encoding="utf-8"))
                      refresh = old.get("archiveVersion") != VERSION
                  except Exception:
                      refresh = True

              if d == TODAY or d == TODAY - timedelta(days=1) or refresh:
                  print(f"Rebuilding {d}")

                  daily = {
                      "date": d.isoformat(),
                      "archiveVersion": VERSION,
                      "timezone": "Europe/Zurich",
                      "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
                      "domains": {}
                  }

                  for hostname, info in domain_info.items():
                      ids = info["ids"]
                      metadata = info["metadata"]
                      batches = [ids[i:i+50] for i in range(0, len(ids), 50)]
                      link_clicks = {}

                      for batch in batches:
                          raw = query_domain_day(hostname, batch, d)
                          for link_id in batch:
                              meta = metadata[link_id]
                              value = as_clicks(raw.get(link_id))
                              key = meta.get("path") or link_id
                              link_clicks[key] = {
                                  **meta,
                                  "clicks": value
                              }

                      total = sum(
                          item["clicks"]
                          for item in link_clicks.values()
                          if isinstance(item.get("clicks"), int)
                      )

                      daily["domains"][hostname] = {
                          "hostname": hostname,
                          "links": list(metadata.values()),
                          "linkClicks": link_clicks,
                          "statistics": {
                              "clicks": total,
                              "source": "batched-link-clicks"
                          }
                      }

                  output_file.write_text(
                      json.dumps(daily, ensure_ascii=False, indent=2),
                      encoding="utf-8"
                  )

              d += timedelta(days=1)

          files = sorted(
              p.stem
              for p in OUT.glob("????-??-??.json")
          )

          (OUT / "index.json").write_text(
              json.dumps({
                  "archiveVersion": VERSION,
                  "startDate": files[0] if files else None,
                  "endDate": files[-1] if files else None,
                  "dates": files,
                  "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
              }, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Build reliable aggregate analytics
        run: |
          python3 <<'PY'
          import json
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          data_dir = Path("public/data")

          months = defaultdict(lambda: {
              "clicks": 0,
              "domains": defaultdict(int)
          })

          links = {}

          for path in sorted(data_dir.glob("????-??-??.json")):
              daily = json.loads(path.read_text(encoding="utf-8"))
              day = daily["date"]
              month = day[:7]

              for hostname, domain in daily.get("domains", {}).items():
                  for path_name, item in domain.get("linkClicks", {}).items():
                      link_id = item.get("id")
                      clicks = item.get("clicks")

                      if not link_id or not isinstance(clicks, (int, float)) or clicks < 0:
                          continue

                      key = f"{hostname}:{link_id}"
                      entry = links.setdefault(key, {
                          "domain": hostname,
                          "id": link_id,
                          "path": item.get("path"),
                          "displayPath": item.get("displayPath"),
                          "title": item.get("title"),
                          "originalURL": item.get("originalURL"),
                          "createdAt": item.get("createdAt"),
                          "days": {},
                          "totals": {
                              "clicks": 0,
                              "byMonth": defaultdict(int)
                          }
                      })

                      value = int(clicks)
                      entry["days"][day] = value
                      entry["totals"]["clicks"] += value
                      entry["totals"]["byMonth"][month] += value

                      months[month]["clicks"] += value
                      months[month]["domains"][hostname] += value

          def normalise(value):
              if isinstance(value, defaultdict):
                  value = dict(value)
              if isinstance(value, dict):
                  return {k: normalise(v) for k, v in value.items()}
              return value

          by_path = defaultdict(list)
          for key, entry in links.items():
              path = entry.get("path")
              if path:
                  by_path[path].append(key)

          result = {
              "archiveVersion": VERSION,
              "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "timezone": "Europe/Zurich",
              "months": normalise(months),
              "links": normalise(links),
              "linksByPath": normalise(by_path),
              "allTime": {
                  "clicks": sum(entry["totals"]["clicks"] for entry in links.values()),
                  "domains": normalise({
                      hostname: sum(
                          entry["totals"]["clicks"]
                          for entry in links.values()
                          if entry["domain"] == hostname
                      )
                      for hostname in {
                          entry["domain"] for entry in links.values()
                      }
                  })
              }
          }

          Path("public/data/aggregates.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Build compact query index
        run: |
          python3 <<'PY'
          import hashlib
          import json
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          aggregate_path = Path("public/data/aggregates.json")
          aggregate = json.loads(aggregate_path.read_text(encoding="utf-8"))

          query_dir = Path("public/query")
          links_dir = query_dir / "links"
          links_dir.mkdir(parents=True, exist_ok=True)

          index = {
              "version": "1",
              "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "timezone": "Europe/Zurich",
              "links": {},
              "paths": defaultdict(list)
          }

          for key, entry in aggregate.get("links", {}).items():
              link_hash = hashlib.sha256(key.encode("utf-8")).hexdigest()
              filename = f"{link_hash}.json"

              compact = {
                  "domain": entry.get("domain"),
                  "id": entry.get("id"),
                  "path": entry.get("path"),
                  "displayPath": entry.get("displayPath"),
                  "title": entry.get("title"),
                  "originalURL": entry.get("originalURL"),
                  "createdAt": entry.get("createdAt"),
                  "days": entry.get("days", {}),
                  "totals": entry.get("totals", {})
              }

              (links_dir / filename).write_text(
                  json.dumps(compact, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

              record = {
                  "domain": entry.get("domain"),
                  "id": entry.get("id"),
                  "path": entry.get("path"),
                  "title": entry.get("title"),
                  "createdAt": entry.get("createdAt"),
                  "file": f"links/{filename}"
              }

              index["links"][key] = record
              path = entry.get("path")
              if path:
                  index["paths"][path].append(key)

          index["paths"] = dict(index["paths"])

          (query_dir / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          (query_dir / "README.json").write_text(
              json.dumps({
                  "description": "Queryable Blobigames link analytics.",
                  "query": {
                      "step1": "Fetch query/index.json to resolve one or more paths to link files.",
                      "step2": "Fetch the required query/links/*.json files.",
                      "step3": "For each requested link, sum days[YYYY-MM-DD] over the inclusive requested date range.",
                      "step4": "For multiple links, sum their results.",
                      "note": "createdAt identifies when a link actually existed, so later-created links are not penalised for earlier dates."
                  }
              }, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Generate readable HTML
        run: |
          python3 <<'PY'
          import json
          from html import escape
          from pathlib import Path

          data = json.loads(
              Path("public/full-data.json").read_text(encoding="utf-8")
          )

          pretty = json.dumps(data, indent=2, ensure_ascii=False)
          generated = escape(data.get("generatedAt", "Unknown"))

          html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Blobigames Analytics</title>
          </head>
          <body>
            <h1>Blobigames Short.io Analytics</h1>
            <p>Generated: {generated}</p>
            <p><a href="full-data.json">Complete current JSON</a></p>
            <p><a href="data/index.json">Daily archive index</a></p>
            <p><a href="data/aggregates.json">Aggregate dataset</a></p>
            <p><a href="query/index.json">Queryable link index</a></p>
            <p><a href="query/README.json">Query instructions</a></p>
            <pre style="white-space:pre-wrap;word-break:break-word;font-family:monospace;font-size:13px;line-height:1.45">{escape(pretty)}</pre>
          </body>
          </html>'''

          Path("public/index.html").write_text(html, encoding="utf-8")
          PY

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/query public/full-data.json public/index.html
          git diff --cached --quiet || git commit -m "Build fully queryable analytics archive"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
