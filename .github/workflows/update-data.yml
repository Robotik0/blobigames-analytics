name: Update Blobigames Analytics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  START_DATE: "2026-03-13"
  WORKER: "https://shortioapikey.help-blobigames.workers.dev"

jobs:
  archive-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current complete export
        run: |
          mkdir -p public
          curl -L --fail --retry 3 "$WORKER/data" -o public/full-data.json

      - name: Build daily historical archive
        env:
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: |
          test -n "$ARCHIVE_TOKEN" || { echo "ARCHIVE_TOKEN GitHub secret is missing"; exit 1; }
          python3 <<'PY'
          import json, os, time
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          START = date.fromisoformat(os.environ["START_DATE"])
          WORKER = os.environ["WORKER"]
          TOKEN = os.environ["ARCHIVE_TOKEN"]
          out = Path("public/data")
          out.mkdir(parents=True, exist_ok=True)
          today = datetime.now(timezone.utc).date()

          def fetch_day(d):
              url = f"{WORKER}/day?{urlencode({'date': d.isoformat()})}"
              req = Request(url, headers={
                  "Accept": "application/json",
                  "X-Archive-Token": TOKEN
              })
              last = None
              for attempt in range(3):
                  try:
                      with urlopen(req, timeout=180) as r:
                          if r.status != 200:
                              raise RuntimeError(f"HTTP {r.status}")
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last = e
                      time.sleep(2 ** attempt)
              raise RuntimeError(f"Daily request failed for {d}: {last}")

          d = START
          while d <= today:
              f = out / f"{d.isoformat()}.json"
              if d == today or d == today - timedelta(days=1) or not f.exists():
                  print(f"Fetching {d}")
                  f.write_text(json.dumps(fetch_day(d), ensure_ascii=False, indent=2), encoding="utf-8")
              d += timedelta(days=1)

          files = sorted(p.stem for p in out.glob("????-??-??.json"))
          (out / "index.json").write_text(json.dumps({
              "startDate": files[0] if files else None,
              "endDate": files[-1] if files else None,
              "dates": files,
              "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Generate readable HTML
        run: |
          python3 <<'PY'
          import json
          from html import escape
          from pathlib import Path
          data = json.loads(Path("public/full-data.json").read_text(encoding="utf-8"))
          pretty = json.dumps(data, indent=2, ensure_ascii=False)
          generated = escape(data.get("generatedAt", "Unknown"))
          html = f'''<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blobigames Analytics</title></head><body><h1>Blobigames Short.io Analytics</h1><p>Generated: {generated}</p><p><a href="full-data.json">Complete current JSON</a></p><p><a href="data/index.json">Daily archive index</a></p><pre style="white-space:pre-wrap;word-break:break-word">{escape(pretty)}</pre></body></html>'''
          Path("public/index.html").write_text(html, encoding="utf-8")
          PY

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/full-data.json public/index.html
          git diff --cached --quiet || git commit -m "Update Blobigames analytics archive"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
