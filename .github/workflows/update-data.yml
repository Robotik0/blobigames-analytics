name: Update Blobigames Analytics

on:
  push:
    paths:
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  START_DATE: "2026-03-13"
  WORKER: "https://shortioapikey.help-blobigames.workers.dev"
  ARCHIVE_VERSION: "5"

jobs:
  archive-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current complete export
        run: |
          mkdir -p public
          curl -L --fail --retry 8 --retry-delay 3 \
            -A "BlobigamesAnalytics/5.0" \
            "$WORKER/data" \
            -o public/full-data.json

      - name: Rebuild daily archive
        run: |
          mkdir -p public/data

          python3 <<'PY'
          import json
          import os
          import time
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          START = date.fromisoformat(os.environ["START_DATE"])
          WORKER = os.environ["WORKER"]
          VERSION = os.environ["ARCHIVE_VERSION"]
          OUT = Path("public/data")
          TODAY = datetime.now(timezone.utc).date()

          def get_json(url, attempts=8):
              last_error = None

              for attempt in range(attempts):
                  try:
                      req = Request(
                          url,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "BlobigamesAnalytics/5.0"
                          }
                      )

                      with urlopen(req, timeout=180) as response:
                          status = getattr(response, "status", 200)

                          if status != 200:
                              raise RuntimeError(
                                  f"HTTP {status}"
                              )

                          return json.loads(
                              response.read().decode("utf-8")
                          )

                  except Exception as exc:
                      last_error = exc

                      if attempt < attempts - 1:
                          time.sleep(
                              min(
                                  30,
                                  2 ** attempt
                              )
                          )

              raise RuntimeError(
                  f"Request failed after {attempts} attempts: {last_error}"
              )

          # ------------------------------------------------------
          # Get current link inventory
          # ------------------------------------------------------

          links_response = get_json(
              f"{WORKER}/links"
          )

          domains = links_response.get(
              "domains",
              {}
          )

          if not domains:
              raise RuntimeError(
                  "Worker returned no domains from /links"
              )

          domain_info = {}

          for hostname, links in domains.items():

              if not isinstance(
                  links,
                  list
              ):
                  continue

              ids = []
              metadata = {}

              for link in links:

                  if not isinstance(
                      link,
                      dict
                  ):
                      continue

                  link_id = (
                      link.get("idString")
                      or link.get("id")
                  )

                  if not link_id:
                      continue

                  ids.append(link_id)

                  metadata[link_id] = {
                      "id":
                          link_id,

                      "path":
                          link.get("path"),

                      "displayPath":
                          link.get("displayPath"),

                      "title":
                          link.get("title"),

                      "originalURL":
                          link.get("originalURL"),

                      "createdAt":
                          link.get("createdAt")
                  }

              domain_info[hostname] = {
                  "ids":
                      ids,

                  "metadata":
                      metadata
              }

          # ------------------------------------------------------
          # Query one domain for one day
          # ------------------------------------------------------

          def query_domain_day(
              hostname,
              ids,
              day
          ):

              if not ids:
                  return {}

              params = urlencode({
                  "domain":
                      hostname,

                  "ids":
                      ",".join(ids),

                  "startDate":
                      day.isoformat(),

                  "endDate":
                      day.isoformat()
              })

              data = get_json(
                  f"{WORKER}/link-clicks?{params}"
              )

              raw = data.get(
                  "clicks",
                  {}
              )

              if not isinstance(
                  raw,
                  dict
              ):
                  raise RuntimeError(
                      f"Unexpected link-click response for "
                      f"{hostname} on {day}"
                  )

              return raw

          # ------------------------------------------------------
          # Convert click values safely
          # ------------------------------------------------------

          def as_clicks(value):

              if isinstance(
                  value,
                  bool
              ):
                  return None

              if isinstance(
                  value,
                  int
              ):
                  return (
                      value
                      if value >= 0
                      else None
                  )

              if isinstance(
                  value,
                  float
              ):
                  return (
                      int(value)
                      if value >= 0
                      else None
                  )

              if isinstance(
                  value,
                  str
              ):
                  try:
                      number = int(
                          float(value)
                      )

                      return (
                          number
                          if number >= 0
                          else None
                      )

                  except ValueError:
                      return None

              if isinstance(
                  value,
                  dict
              ):

                  # Only a nested "clicks" value is accepted.
                  if "clicks" in value:
                      return as_clicks(
                          value["clicks"]
                      )

              return None

          # ------------------------------------------------------
          # Rebuild every historical day
          # ------------------------------------------------------

          current = START

          while current <= TODAY:

              output_file = (
                  OUT /
                  f"{current.isoformat()}.json"
              )

              rebuild = True

              if output_file.exists():

                  try:
                      old = json.loads(
                          output_file.read_text(
                              encoding="utf-8"
                          )
                      )

                      rebuild = (
                          old.get(
                              "archiveVersion"
                          )
                          != VERSION
                      )

                  except Exception:
                      rebuild = True

              if (
                  current == TODAY
                  or
                  current == TODAY - timedelta(days=1)
                  or
                  rebuild
              ):

                  print(
                      f"Rebuilding {current}"
                  )

                  daily = {
                      "date":
                          current.isoformat(),

                      "archiveVersion":
                          VERSION,

                      "timezone":
                          "Europe/Zurich",

                      "generatedAt":
                          datetime.now(
                              timezone.utc
                          ).isoformat().replace(
                              "+00:00",
                              "Z"
                          ),

                      "domains":
                          {}
                  }

                  for hostname, info in domain_info.items():

                      ids = info["ids"]
                      metadata = info["metadata"]

                      batches = [
                          ids[i:i + 40]
                          for i
                          in range(
                              0,
                              len(ids),
                              40
                          )
                      ]

                      link_clicks = {}

                      for batch in batches:

                          raw = query_domain_day(
                              hostname,
                              batch,
                              current
                          )

                          for link_id in batch:

                              meta = metadata[
                                  link_id
                              ]

                              # CRITICAL:
                              # Read ONLY the exact link ID.
                              value = as_clicks(
                                  raw.get(
                                      link_id
                                  )
                              )

                              key = (
                                  meta.get("path")
                                  or link_id
                              )

                              link_clicks[key] = {
                                  **meta,
                                  "clicks":
                                      value
                              }

                      total = sum(
                          item["clicks"]
                          for item
                          in link_clicks.values()
                          if isinstance(
                              item.get("clicks"),
                              int
                          )
                      )

                      daily[
                          "domains"
                      ][hostname] = {
                          "hostname":
                              hostname,

                          "links":
                              list(
                                  metadata.values()
                              ),

                          "linkClicks":
                              link_clicks,

                          "statistics": {
                              "clicks":
                                  total,

                              "source":
                                  "batched-link-clicks"
                          }
                      }

                  output_file.write_text(
                      json.dumps(
                          daily,
                          ensure_ascii=False,
                          indent=2
                      ),
                      encoding="utf-8"
                  )

              current += timedelta(days=1)

          # ------------------------------------------------------
          # Daily index
          # ------------------------------------------------------

          files = sorted(
              p.stem
              for p
              in OUT.glob(
                  "????-??-??.json"
              )
          )

          (
              OUT / "index.json"
          ).write_text(
              json.dumps(
                  {
                      "archiveVersion":
                          VERSION,

                      "startDate":
                          files[0]
                          if files
                          else None,

                      "endDate":
                          files[-1]
                          if files
                          else None,

                      "dates":
                          files,

                      "generatedAt":
                          datetime.now(
                              timezone.utc
                          ).isoformat().replace(
                              "+00:00",
                              "Z"
                          )
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          PY

      - name: Build queryable per-link archive
        run: |
          python3 <<'PY'
          import hashlib
          import json
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          VERSION = "5"

          data_dir = Path(
              "public/data"
          )

          query_dir = Path(
              "public/query"
          )

          links_dir = (
              query_dir /
              "links"
          )

          links_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          links = {}

          # ------------------------------------------------------
          # Read every daily file and construct one record per
          # actual link ID.
          # ------------------------------------------------------

          for path in sorted(
              data_dir.glob(
                  "????-??-??.json"
              )
          ):

              daily = json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )

              day = daily["date"]

              for hostname, domain in (
                  daily.get(
                      "domains",
                      {}
                  ).items()
              ):

                  for (
                      path_name,
                      item
                  ) in (
                      domain.get(
                          "linkClicks",
                          {}
                      ).items()
                  ):

                      link_id = item.get(
                          "id"
                      )

                      if not link_id:
                          continue

                      clicks = item.get(
                          "clicks"
                      )

                      if not isinstance(
                          clicks,
                          int
                      ):
                          continue

                      key = (
                          f"{hostname}:"
                          f"{link_id}"
                      )

                      entry = links.setdefault(
                          key,
                          {
                              "domain":
                                  hostname,

                              "id":
                                  link_id,

                              "path":
                                  item.get(
                                      "path"
                                  ),

                              "displayPath":
                                  item.get(
                                      "displayPath"
                                  ),

                              "title":
                                  item.get(
                                      "title"
                                  ),

                              "originalURL":
                                  item.get(
                                      "originalURL"
                                  ),

                              "createdAt":
                                  item.get(
                                      "createdAt"
                                  ),

                              "days":
                                  {},

                              "totalClicks":
                                  0
                          }
                      )

                      entry[
                          "days"
                      ][day] = clicks

                      entry[
                          "totalClicks"
                      ] += clicks

          # ------------------------------------------------------
          # Build small index
          # ------------------------------------------------------

          index = {
              "version":
                  "1",

              "archiveVersion":
                  VERSION,

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat().replace(
                      "+00:00",
                      "Z"
                  ),

              "timezone":
                  "Europe/Zurich",

              "links":
                  {},

              "paths":
                  defaultdict(list)
          }

          for key, entry in links.items():

              file_id = hashlib.sha256(
                  key.encode("utf-8")
              ).hexdigest()

              filename = (
                  f"{file_id}.json"
              )

              output = {
                  "domain":
                      entry["domain"],

                  "id":
                      entry["id"],

                  "path":
                      entry["path"],

                  "displayPath":
                      entry["displayPath"],

                  "title":
                      entry["title"],

                  "originalURL":
                      entry["originalURL"],

                  "createdAt":
                      entry["createdAt"],

                  "days":
                      entry["days"],

                  "totalClicks":
                      entry["totalClicks"]
              }

              (
                  links_dir /
                  filename
              ).write_text(
                  json.dumps(
                      output,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              index["links"][key] = {
                  "domain":
                      entry["domain"],

                  "id":
                      entry["id"],

                  "path":
                      entry["path"],

                  "title":
                      entry["title"],

                  "createdAt":
                      entry["createdAt"],

                  "file":
                      f"links/{filename}"
              }

              if entry["path"]:
                  index[
                      "paths"
                  ][
                      entry["path"]
                  ].append(key)

          index[
              "paths"
          ] = dict(
              index["paths"]
          )

          (
              query_dir /
              "index.json"
          ).write_text(
              json.dumps(
                  index,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          (
              query_dir /
              "README.json"
          ).write_text(
              json.dumps(
                  {
                      "description":
                          "Blobigames analytics query index.",

                      "queryMethod": {
                          "resolve":
                              "Use query/index.json to resolve a path to one or more link files.",

                          "combine":
                              "Fetch any number of link files and sum their daily values.",

                          "dateRange":
                              "Sum only days whose YYYY-MM-DD key falls inside the requested inclusive range.",

                          "creationDate":
                              "Use createdAt to determine when a link actually existed.",

                          "allTime":
                              "Use totalClicks when the full archived lifetime is requested."
                      }
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          PY

      - name: Generate readable index page
        run: |
          python3 <<'PY'
          import json
          from html import escape
          from pathlib import Path

          data = json.loads(
              Path(
                  "public/full-data.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          generated = escape(
              data.get(
                  "generatedAt",
                  "Unknown"
              )
          )

          html = f"""
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Blobigames Analytics</title>
          </head>
          <body>
            <h1>Blobigames Analytics</h1>
            <p>Generated: {generated}</p>

            <ul>
              <li>
                <a href="full-data.json">
                  Complete current data
                </a>
              </li>

              <li>
                <a href="data/index.json">
                  Daily archive index
                </a>
              </li>

              <li>
                <a href="query/index.json">
                  Queryable link index
                </a>
              </li>

              <li>
                <a href="query/README.json">
                  Query instructions
                </a>
              </li>
            </ul>
          </body>
          </html>
          """

          Path(
              "public/index.html"
          ).write_text(
              html,
              encoding="utf-8"
          )

          PY

      - name: Commit generated analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/data \
            public/query \
            public/full-data.json \
            public/index.html

          if ! git diff --cached --quiet; then
            git commit -m "Update queryable Blobigames analytics"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
