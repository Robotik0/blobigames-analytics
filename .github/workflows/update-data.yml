name: Update Blobigames Analytics

on:
  push:
    paths:
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  START_DATE: "2026-03-13"
  WORKER: "https://shortioapikey.help-blobigames.workers.dev"

jobs:
  archive-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current complete export
        run: |
          mkdir -p public
          curl -L --fail --retry 3 \
            "$WORKER/data" \
            -o public/full-data.json

      - name: Build daily historical archive
        run: |
          mkdir -p public/data

          python3 <<'PY'
          import json
          import os
          import time
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          START = date.fromisoformat(os.environ["START_DATE"])
          WORKER = os.environ["WORKER"]
          out_dir = Path("public/data")
          today = datetime.now(timezone.utc).date()

          def fetch_day(d):
              url = f"{WORKER}/day?{urlencode({'date': d.isoformat()})}"
              last_error = None

              for attempt in range(3):
                  try:
                      req = Request(
                          url,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "BlobigamesAnalytics/1.0"
                          }
                      )

                      with urlopen(req, timeout=180) as response:
                          if response.status != 200:
                              raise RuntimeError(
                                  f"HTTP {response.status}"
                              )

                          return json.loads(
                              response.read().decode("utf-8")
                          )

                  except Exception as exc:
                      last_error = exc
                      time.sleep(2 ** attempt)

              raise RuntimeError(
                  f"Daily request failed for {d}: {last_error}"
              )

          d = START

          while d <= today:
              output_file = out_dir / f"{d.isoformat()}.json"

              if (
                  d == today
                  or d == today - timedelta(days=1)
                  or not output_file.exists()
              ):
                  print(f"Fetching {d}")
                  daily = fetch_day(d)

                  output_file.write_text(
                      json.dumps(
                          daily,
                          ensure_ascii=False,
                          indent=2
                      ),
                      encoding="utf-8"
                  )

                  time.sleep(0.5)

              d += timedelta(days=1)

          files = sorted(
              p.stem
              for p in out_dir.glob("????-??-??.json")
          )

          (out_dir / "index.json").write_text(
              json.dumps(
                  {
                      "startDate": files[0] if files else None,
                      "endDate": files[-1] if files else None,
                      "dates": files,
                      "generatedAt": datetime.now(
                          timezone.utc
                      ).isoformat().replace("+00:00", "Z")
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )
          PY

      - name: Build aggregate analytics index
        run: |
          python3 <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          data_dir = Path("public/data")
          monthly = defaultdict(lambda: {
              "clicks": 0,
              "humanClicks": 0,
              "domains": defaultdict(lambda: {
                  "clicks": 0,
                  "humanClicks": 0
              })
          })

          all_time = {
              "clicks": 0,
              "humanClicks": 0,
              "domains": defaultdict(lambda: {
                  "clicks": 0,
                  "humanClicks": 0
              })
          }

          for path in sorted(data_dir.glob("????-??-??.json")):
              daily = json.loads(
                  path.read_text(encoding="utf-8")
              )

              month = daily["date"][:7]

              for hostname, domain in daily.get("domains", {}).items():
                  stats = domain.get("statistics", {})
                  clicks = int(stats.get("clicks", 0) or 0)
                  human = int(stats.get("humanClicks", 0) or 0)

                  monthly[month]["clicks"] += clicks
                  monthly[month]["humanClicks"] += human
                  monthly[month]["domains"][hostname]["clicks"] += clicks
                  monthly[month]["domains"][hostname]["humanClicks"] += human

                  all_time["clicks"] += clicks
                  all_time["humanClicks"] += human
                  all_time["domains"][hostname]["clicks"] += clicks
                  all_time["domains"][hostname]["humanClicks"] += human

          def normalise(obj):
              if isinstance(obj, defaultdict):
                  obj = dict(obj)
              if isinstance(obj, dict):
                  return {k: normalise(v) for k, v in obj.items()}
              return obj

          result = {
              "generatedAt": __import__("datetime").datetime.now(
                  __import__("datetime").timezone.utc
              ).isoformat().replace("+00:00", "Z"),
              "timezone": "Europe/Zurich",
              "months": normalise(dict(monthly)),
              "allTime": normalise(all_time)
          }

          Path("public/data/aggregates.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Generate readable HTML
        run: |
          python3 <<'PY'
          import json
          from html import escape
          from pathlib import Path

          data = json.loads(
              Path("public/full-data.json").read_text(
                  encoding="utf-8"
              )
          )

          pretty = json.dumps(
              data,
              indent=2,
              ensure_ascii=False
          )

          generated = escape(
              data.get("generatedAt", "Unknown")
          )

          html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Blobigames Analytics</title>
          </head>
          <body>
            <h1>Blobigames Short.io Analytics</h1>
            <p>Complete current dataset for both Blobigames domains.</p>
            <p>Generated: {generated}</p>
            <p><a href="full-data.json">Complete current JSON</a></p>
            <p><a href="data/index.json">Daily historical archive index</a></p>
            <p><a href="data/aggregates.json">Analytics aggregates</a></p>
            <pre style="white-space:pre-wrap;word-break:break-word;font-family:monospace;font-size:13px;line-height:1.45">{escape(pretty)}</pre>
          </body>
          </html>'''

          Path("public/index.html").write_text(
              html,
              encoding="utf-8"
          )
          PY

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data public/full-data.json public/index.html

          git diff --cached --quiet || \
            git commit -m "Update Blobigames analytics archive"

          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
