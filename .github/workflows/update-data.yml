name: Update Blobigames Analytics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest analytics
        run: |
          mkdir -p public

          curl -L --fail \
            "https://shortioapikey.help-blobigames.workers.dev/data" \
            -o public/full-data.json

      - name: Generate readable HTML
        run: |
          python3 <<'PY'
          import json
          from html import escape
          from pathlib import Path

          data = json.loads(
              Path("public/full-data.json").read_text(
                  encoding="utf-8"
              )
          )

          pretty = json.dumps(
              data,
              indent=2,
              ensure_ascii=False
          )

          generated = escape(
              data.get("generatedAt", "Unknown")
          )

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Blobigames Analytics</title>
            <style>
              body {{
                font-family: Arial, sans-serif;
                margin: 30px;
                background: #ffffff;
                color: #111111;
              }}

              h1 {{
                margin-bottom: 5px;
              }}

              p {{
                color: #555555;
              }}

              pre {{
                white-space: pre-wrap;
                word-break: break-word;
                font-family: monospace;
                font-size: 13px;
                line-height: 1.45;
              }}
            </style>
          </head>
          <body>
            <h1>Blobigames Short.io Analytics</h1>
            <p>Complete dataset for both Blobigames domains.</p>
            <p>Generated: {generated}</p>

            <p>
              <a href="full-data.json">
                Download raw JSON
              </a>
            </p>

            <pre>{escape(pretty)}</pre>
          </body>
          </html>
          """

          Path("public/index.html").write_text(
              html,
              encoding="utf-8"
          )
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
