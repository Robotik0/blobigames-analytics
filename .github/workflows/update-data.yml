name: Update Blobigames Analytics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest analytics
        run: |
          mkdir -p public
          curl -L --fail \
            "https://shortioapikey.help-blobigames.workers.dev/data" \
            -o public/full-data.json

      - name: Create index
        run: |
          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Blobigames Analytics</title>
          </head>
          <body>
            <h1>Blobigames Analytics</h1>
            <p>Complete Short.io dataset.</p>
            <p><a href="full-data.json">Open full-data.json</a></p>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
